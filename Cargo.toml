[package]
name = "nrw-freestyle-cup-registration"
version = "0.1.0"
edition = "2024"
default-run = "nrw-freestyle-cup-registration"

[[bin]]
name = "nrw-freestyle-cup-registration"
path = "src/bin/registration_server.rs"

[[bin]]
name = "gen_openapi"
path = "src/bin/gen_openapi.rs"

[[bin]]
name = "seed_demo"
path = "src/bin/seed_demo.rs"

[[bin]]
name = "cup-player"
path = "src/bin/cup_player.rs"
required-features = ["cli-player"]

[dependencies]
askama = "0.16.0"
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
axum-embed = "0.1.0"
axum-extra = { version = "0.12", features = ["cookie"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
color-eyre = "0.6.5"
dotenvy = "0.15.7"
eyre = "0.6.12"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
lettre = { version = "0.11.22", features = [
  "builder",
  "hostname",
  "pool",
  "rustls-tls",
  "smtp-transport",
  "tokio1-rustls-tls",
], default-features = false }
password-auth = "1.0.0"
rust-embed = "8.11.0"
serde = "1"
serde_json = "1"
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "sqlite",
  "time",
  "uuid",
] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "macros", "parsing", "formatting"] }
toml = "1"
tokio = { version = "1.52.3", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = [
  "cors",
  "fs",
  "request-id",
  "trace",
] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = { version = "2.5.8", features = ["serde"] }
utoipa = { version = "6", features = [
  "axum_extras",
  "debug",
  "time",
  "uuid",
  "yaml",
] }
utoipa-axum = { version = "0.3", features = ["debug"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
uuid = { version = "1.29.0", features = ["serde", "v5", "v7"] }
prometheus-client = "0.25.1"
rodio = { version = "0.23.0", optional = true, default-features = false, features = ["playback", "mp3", "wav"] }
# Photos from Nextcloud (WebDAV) and the command-line player's downloads.
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
roxmltree = "0.21"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# The command-line player's connection to the server (feature player-client).
futures-util = { version = "0.3", optional = true, features = ["sink"] }
tokio-tungstenite = { version = "0.30.0", optional = true, features = ["rustls-tls-native-roots"] }

[dev-dependencies]
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
testcontainers = "0.28"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }

[features]
# The server player (remote music playback on the server's own sound card).
# Needs the ALSA headers (libasound2-dev) on Linux.
local-audio = ["dep:rodio"]
# The command-line player's connection to the server, without the sound card,
# so its tests run without the ALSA headers.
player-client = ["dep:futures-util", "dep:tokio-tungstenite"]
# The command-line player `cup-player`: plays on the sound card of the
# computer it runs on. Needs the ALSA headers like local-audio.
cli-player = ["player-client", "local-audio"]
