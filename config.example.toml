# Example configuration. Copy to config.toml (ignored by git) and adjust.
#
# Every setting in [server], [database], [smtp], [auth] and [admin] can also be
# set by a CLI flag or environment variable (including .env), which take
# precedence over this file. Secrets are better kept in environment variables.
#
# [competition], [[categories]] and [[timeplan]] are event settings and only
# come from this file:
# - [competition] is written to the database on every start.
# - [[categories]] and [[timeplan]] are only written into empty tables, so
#   changes made in the admin UI are kept. To reseed them, start with a fresh
#   database.

[server]
# base_url = "https://anmeldung.freestyle-cup.nrw"   # BASE_URL
# http_address = "127.0.0.1:3000"                    # HTTP_ADDRESS
# data_path = "./data"                               # DATA_PATH
# insecure_cookies = false                           # INSECURE_COOKIES
# reload_db_token = "…"                              # RELOAD_DB_TOKEN

[database]
# url = "sqlite://./db.sqlite?mode=rwc"              # DATABASE_URL

[smtp]
# server = "smtp.example.org"                        # SMTP_SERVER
# user = "anmeldung@example.org"                     # SMTP_USER
# password = "…"                                     # SMTP_PASSWORD

[auth]
# jwt_secret = "…"                                   # JWT_SECRET

# Only inserted if no admin exists yet.                # ADMIN (as JSON)
# [admin]
# name = "Admin"
# email = "admin@example.org"
# password = "…"

[competition]
id = "nrw-freestyle-cup-2027"
name = "NRW Freestyle Cup 2027"
location = "SSV Nümbrecht"
# Example dates: replace them with the real ones.
start_date = 2027-06-05
end_date = 2027-06-05
# All ages, and with them the categories, are counted against this day.
determining_day = 2027-06-01
registration_start = 2026-12-01T00:00:00+01:00
registration_end = 2027-04-30T23:59:59+02:00
music_upload_end = 2027-05-15T23:59:59+02:00
# Fee per start in €. Each single, pair and group start counts once.
fee_per_start = 15
# Maximum fee per starter in €, so only the first three starts are charged.
max_fee_per_starter = 45

[competition.payment]
deadline = 2027-05-15
account_holder = "Peter Kaufmann"
iban = "DE65 1203 0000 1060 4054 85"
bic = "BYLADEM1001"
# The club name is appended, e.g. "Startgeld: SSV Nümbrecht".
reference = "Startgeld"

# Categories in timeplan order.
#
# Ages are in years on the determining day: min_age is inclusive, under_age is
# exclusive ("U15" = under_age 15). A missing bound means open-ended. Explicit
# from_birthday (inclusive) / to_birthday (exclusive) dates override the ages.
# act_type is "single" or "pair". single_male = true marks the male single
# categories; the other single categories are for female riders.

[[categories]]
name = "EMU11"
description = "Einzel Männlich U11"
act_type = "single"
single_male = true
under_age = 11
einfahrzeit_minutes = 10
act_duration_minutes = 3
judge_duration_minutes = 4

