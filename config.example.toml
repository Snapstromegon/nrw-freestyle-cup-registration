# Example configuration. Copy to config.toml (ignored by git) and adjust.
#
# Every setting in [server], [database], [smtp], [auth], [admin] and [photos] can also be
# set by a CLI flag or environment variable (including .env), which take
# precedence over this file. Secrets are better kept in environment variables.
#
# [competition], [[categories]] and [[timeplan]] are event settings and only
# come from this file:
# - [competition] is written to the database on every start.
# - [[categories]] and [[timeplan]] are only written into empty tables, so
#   changes made in the admin UI are kept. To reseed them, start with a fresh
#   database.

[server]
# base_url = "https://anmeldung.freestyle-cup.nrw"   # BASE_URL
# http_address = "127.0.0.1:3000"                    # HTTP_ADDRESS
# data_path = "./data"                               # DATA_PATH
# insecure_cookies = false                           # INSECURE_COOKIES
# reload_db_token = "…"                              # RELOAD_DB_TOKEN
# Turns on GET /metrics for Prometheus (Authorization: Bearer <token>).
# metrics_token = "…"                                # METRICS_TOKEN
# Name of the server player: plays music on this server's sound card. Needs a
# build with the local-audio feature (make event-release).
# local_player = "Halle"                             # LOCAL_PLAYER

[database]
# url = "sqlite://./db.sqlite?mode=rwc"              # DATABASE_URL

[smtp]
# server = "smtp.example.org"                        # SMTP_SERVER (or smtp://host:port)
# For an SMTP URL, put relay credentials in the URL if it requires them.
# user = "anmeldung@example.org"                     # SMTP_USER
# password = "…"                                     # SMTP_PASSWORD

[auth]
# jwt_secret = "…"                                   # JWT_SECRET

# Optional: the photos of the info board, the newest after each act and random
# recent ones in breaks; the music control previews the newest. The folder and
# its direct subfolders count. One of:
# - a folder in a Nextcloud account over WebDAV, with the user and an app
#   password: https://cloud.example.org/remote.php/dav/files/anna/Fotos
# - a Nextcloud share link (a password only if the share has one):
#   https://cloud.example.org/s/AbC123
# - a local folder, e.g. one the Nextcloud desktop client keeps in sync.
# [photos]
# source = "https://cloud.example.org/remote.php/dav/files/anna/Fotos"  # PHOTOS_SOURCE
# user = "anna"                                      # PHOTOS_USER
# password = "…"                                     # PHOTOS_PASSWORD

# Only inserted if no admin exists yet.                # ADMIN (as JSON)
# [admin]
# name = "Admin"
# email = "admin@example.org"
# password = "…"

[competition]
id = "einradevent-demo-2027"
name = "Einradevent Demo 2027"
location = "SSV Nümbrecht"
# Example dates: replace them with the real ones. They are checked on startup:
# registration and the music upload must end before start_date. Winter dates
# need the +01:00 offset, summer dates +02:00.
start_date = 2027-06-05
end_date = 2027-06-05
# All ages, and with them the categories, are counted against this day.
determining_day = 2027-06-01
registration_start = 2026-12-01T00:00:00+01:00
registration_end = 2027-04-30T23:59:59+02:00
music_upload_end = 2027-05-15T23:59:59+02:00
# Fee per start in €. Each single, pair and group start counts once.
fee_per_start = 15
# Maximum fee per starter in €, so only the first three starts are charged.
max_fee_per_starter = 45
# Optional, shown to clubs on their page.
venue = "Sporthalle Musterstadt, Musterstraße 1, 12345 Musterstadt"
contact_email = "info@example.org"
announcement_url = "https://example.org/ausschreibung/"
# Optional: where the info board's photo QR code leads, e.g. a share link.
photos_url = "https://fotos.hoeser.dev"

[competition.payment]
# Optional: leave it out until the deadline is decided.
deadline = 2027-05-15
# Must match the account holder exactly: banks compare the payee name on
# every transfer (Verification of Payee) and warn payers about a mismatch.
account_holder = "Demo Kassenwart"
iban = "DE02 1203 0000 0000 2020 51"
bic = "BYLADEM1001"
# The club name and its code are appended, e.g.
# "Startgeld: SSV Nümbrecht (EV-K7Q3)". The QR code adds "QR" at the end.
reference = "Startgeld"

# Categories in timeplan order.
#
# Ages are in years on the determining day: min_age is inclusive, under_age is
# exclusive ("U15" = under_age 15). A missing bound means open-ended. Explicit
# from_birthday (inclusive) / to_birthday (exclusive) dates override the ages.
# act_type is "single", "pair", "group_small" (Kleingruppe, 3 to 8 riders) or
# "group_large" (Großgruppe, more than 8 riders). single_male = true marks the
# male single categories; the other single categories are for female riders.
# A group's age is that of its oldest rider, replacement riders included.

[[categories]]
name = "EMU11"
description = "Einzel Männlich U11"
act_type = "single"
single_male = true
under_age = 11
einfahrzeit_minutes = 10
act_duration_minutes = 3
