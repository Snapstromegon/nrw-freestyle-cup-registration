# Demo data for development: fills every table so all of the UI can be tried
# out. Load it with
#
#     cargo run --bin seed_demo
#
# which DELETES the configured database, recreates it and applies this file
# (see src/demo.rs). Tests use it as well.
#
# Every user's password is their first name, e.g. "Maria". Logins:
# - admin@example.org             admin
# - maria.wagner@example.org      SSV Nümbrecht, paid in full, live timeplan acts,
#                                 owns a small group across clubs, all checked in
# - jonas.becker@example.org      RSC Köln, paid partially, owns a large group,
#                                 partly checked in
# - lena.schmitz@example.org      RV Bonn, not paid, owns an incomplete group,
#                                 nobody checked in
# - sabine.koch@example.org       club without starters, overpaid, password reset pending
# - tim.neumann@example.org       verified, no club yet
# - paul.hoffmann@example.org     email not verified
#
# Links with the fixed tokens below:
# - /verify_email?token=00000000-0000-4000-8000-000000000001
# - /reset_password?token=00000000-0000-4000-8000-000000000002

# Same format as in config.toml. The registration window is open until the
# end of April 2027; move it into the past to try the closed registration.
[competition]
id = "einrad-demo"
name = "Einradevent 2027 (Demo)"
location = "Düsseldorf"
start_date = 2027-04-01
end_date = 2027-04-02
determining_day = 2027-06-01
registration_start = 2026-01-01T00:00:00+01:00
registration_end = 2027-02-28T23:59:59+01:00
music_upload_end = 2027-03-15T23:59:59+01:00
fee_per_start = 15
max_fee_per_starter = 45

# The clubs' jury obligation (jury registration), with the Jury-Konzept's
# values written out; an empty section would use the same defaults.
[competition.jury]
min_age = 15
deployments_per_two_acts = 4
missing_deployment_fee = 7
# The judge registration ends with the registration (registration_end).

[competition.payment]
deadline = 2027-05-15
account_holder = "Demo Kassenwart"
iban = "DE02 1203 0000 0000 2020 51"
bic = "BYLADEM1001"
reference = "Startgeld"

