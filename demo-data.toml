# shown; a short tone is generated unless song_source points to an audio file
# relative to this file), song_url, song_checked, order, started_at, ended_at.
#
# The songs are by TheFatRat (https://www.thefatrat.com/downloads), used under
# their terms (https://www.thefatrat.com/terms-and-conditions). Those don't
# allow passing the files on, so they aren't in the repository: seed_demo
# downloads each song_url into demo-songs/ once (with curl). Without the
