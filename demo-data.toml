# Groups: name (unique), owner (the club that created it and manages its name),
# act_type ("group_small" for a Kleingruppe, "group_large" for a Großgruppe, as
# the owner chose it) and the full names of the regular riders (members) and
# replacement riders (replacements, Ersatzfahrer), from any club. A Kleingruppe
# should have 3 to 8 regular riders, a Großgruppe more; outside that range the
# group keeps its category, with a warning. With fewer than 3 the group has no
# category yet. Replacements don't count towards the size, but towards the
# age. A rider can be in one small and one large group.

